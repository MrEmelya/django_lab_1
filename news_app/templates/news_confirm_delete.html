{% extends 'base.html' %}

{% block title %}Удаление новости{% endblock %}

{% block content %}
    <div class="row">
        <div class="col-md-6 mx-auto text-center mt-5">
            <div class="card shadow-sm border-danger">
                <div class="card-body p-5">
                    <h2 class="text-danger mb-4">Вы уверены?</h2>
                    <p class="fs-5">Вы собираетесь удалить новость:</p>
                    <p class="fw-bold fs-4">"{{ news.title }}"</p>
                    <p class="text-muted">Это действие нельзя отменить.</p>
                    
                    <form method="post" class="mt-4">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger px-4">Да, удалить</button>
                        <a href="{% url 'news_detail' news.id %}" class="btn btn-secondary">Отмена</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
