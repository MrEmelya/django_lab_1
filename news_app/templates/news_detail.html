{% extends 'base.html' %}

{% block title %}{{ news.title }} - Новостной портал{% endblock %}

{% block content %}
    <div class="row">
        <div class="col-md-8 mx-auto">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="{% url 'home' %}">Главная</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Новость</li>
                </ol>
            </nav>
            
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="mb-3">{{ news.title }}</h1>
                    <p class="text-muted border-bottom pb-2">Опубликовано: {{ news.date }}</p>
                    
                    <div class="mb-4 fs-5 text-secondary">
                        <strong>{{ news.summary }}</strong>
                    </div>
                    
                    <div class="content fs-5" style="white-space: pre-wrap;">
                        {{ news.content }}
                    </div>
                </div>
                <div class="card-footer bg-white py-3">
                    <a href="{% url 'home' %}" class="btn btn-secondary">← Назад к списку</a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
