{% extends 'base.html' %}

{% block title %}Профиль{% endblock %}

{% block content %}
    <div class="row">
        <div class="col-md-6 mx-auto">
            <div class="card shadow-sm mt-4">
                <div class="card-header bg-white">
                    <h3 class="mb-0">Личный кабинет</h3>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted">Вы вошли как: <strong>{{ user.username }}</strong></p>
                    
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-success mt-3">Сохранить изменения</button>
                    </form>
                    
                    <hr class="my-4">
                    <div class="text-end">
                        <a href="{% url 'profile_delete' %}" class="btn btn-outline-danger btn-sm">Удалить аккаунт</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
